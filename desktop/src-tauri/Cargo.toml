[package]
name = "baodou-desktop"
version = "0.2.0"
description = "Native desktop host for baodou computer use assistant"
authors = ["baodou"]
edition = "2021"

[lib]
name = "baodou_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.11", features = ["v4", "serde"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
