# baodou default configuration
# Override via BAODOU_CONFIG env or --config path.

schema_version: "1.0.0"
app:
  name: baodou
  env: dev
  log_level: INFO          # DEBUG | INFO | WARNING | ERROR
  log_json: true           # structured JSON logs to stdout
  log_dir: logs            # relative to project root; empty = stdout only
  graceful_shutdown_sec: 5

paths:
  project_root: null       # auto-detected if null
  model_gguf: model/Qwen3.5-2B-UD-Q4_K_XL.gguf
  mmproj_gguf: model/mmproj-F16.gguf
  # Host machine (locked by Phase A / user env):
  #   conda env: dev
  #   llama SYCL build: D:\llama
  #   oneAPI: D:\Intel\oneAPI\setvars.bat
  llama_dir: "D:/llama"
  oneapi_setvars: "D:/Intel/oneAPI/setvars.bat"

inference:
  host: "127.0.0.1"
  port: 8765
  n_ctx: 4096
  n_gpu_layers: 99
  device: "SYCL0"          # force GPU; never default to CPU
  n_threads: 0             # 0 = auto (cpu_count - 2)
  n_batch: 512
  flash_attn: false        # enable if SYCL build supports -fa
  max_tokens: 768
  temperature: 0.3
  enable_thinking: false
  request_timeout_sec: 90
  health_timeout_sec: 5
  server_start_timeout_sec: 180
  mmproj_offload: true
  backend: mock            # mock | http  (Phase E live: http)
  auto_start_server: false # true = CLI can spawn D:\llama via oneAPI
  warmup_on_start: true
  constraint_mode: json_schema  # none | json_schema | grammar
  stream: false
  max_retries: 1
  degrade_on_error: true
  prompt_name: observe_plan
  llama_build: "b10356"    # D:\llama llama-server version 10356 (0666ad2b2)

capture:
  backend: mss             # mock | mss  (Phase C default: real capture)
  mode: primary            # primary | all | window | region
  monitor_index: 1         # 0=virtual all, 1..=physical (1 often primary)
  target_fps: 5            # default loop rate when stream fps not used
  max_width: 1280
  max_height: 720
  image_format: png        # png | jpeg
  jpeg_quality: 85
  color_mode: RGB
  queue_size: 4
  drop_policy: newest      # newest keeps latest under backpressure
  region: null             # {x,y,width,height} physical virtual-desktop px
  window_title: null
  window_hwnd: null
  change_threshold: 0.015  # mean abs diff on 64x64 sample (0..1-ish)
  change_sample_size: 64
  force_on_user_request: true
  force_on_verify: true
  save_frames: false
  save_dir: benchmarks/phase_c/artifacts
  include_b64: false
  privacy:
    enabled: true
    mask_color: [0, 0, 0]
    manual_masks: []       # [{x,y,width,height,reason}]
    privacy_window_titles:
      - "密码"
      - "Password"
      - "Credential"
      - "银行"
      - "Bank"
    mask_password_class_names:
      - "Edit"
      - "PasswordBox"
  streams:
    preview:
      fps: 10
      max_width: 960
      max_height: 540
      image_format: jpeg
      jpeg_quality: 70
      only_on_change: false
    vision:
      fps: 8
      max_width: 1280
      max_height: 720
      image_format: png
      jpeg_quality: 85
      only_on_change: true
    model:
      fps: 0               # event-driven (user question / planner)
      max_width: 1280
      max_height: 720
      image_format: png
      jpeg_quality: 85
      only_on_change: true
    verify:
      fps: 0               # after action
      max_width: 1280
      max_height: 720
      image_format: png
      jpeg_quality: 85
      only_on_change: false

ui_vision:
  confidence_threshold: 0.5
  max_elements: 64
  timeout_ms: 2000
  # composite = multi-source fuse (Phase D default on Windows)
  backend: composite
  sources:
    - uia
    - rules
    # - ocr   # enable when pytesseract + Tesseract OCR are installed
  fuse_iou_threshold: 0.45
  uia_max_depth: 12
  ocr_enabled: true
  ocr_lang: "chi_sim+eng"
  ocr_min_confidence: 0.4
  rules_enabled: true
  context_max_elements: 32
  annotate_boxes: true

agent:
  max_steps: 8
  default_risk_auto: false
  plan_timeout_sec: 30
  backend: mock            # mock | inference
  auto_confirm: false      # CLI --yes enables for low-risk demo
  reidentify_before_action: true
  max_recovery_attempts: 2
  step_timeout_ms: 10000
  pause_on_target_missing: true
  pause_on_verify_fail: true
  prefer_element_id: true
  coordinate_requires_confirm: true
  post_action_settle_ms: 120
  fallback_to_mock_plan: true

actuator:
  backend: mock            # mock | win  (win still honors dry_run)
  dry_run: true            # Phase F default: never inject real input unless explicit
  max_actions_per_minute: 30
  move_duration_ms: 40
  click_delay_ms: 30
  type_interval_ms: 15
  relocate_iou_min: 0.35
  relocate_require_visible: true
  relocate_require_enabled: true
  verify_change_threshold: 0.008
  verify_require_change: false
  bound_check: true
safety:
  # Phase G: risk / permission / privacy
  default_mode: read_only  # read_only | confirm_all | allow_low
  require_confirmation_below: medium  # low | medium | high
  block_high_risk: true
  sensitive_keywords:
    - delete
    - 删除
    - payment
    - 支付
    - transfer
    - 转账
    - password
    - 密码
    - send
    - 发送
    - publish
    - 发布
    - install
    - 安装
    - uninstall
    - 卸载
    - sudo
    - 权限
    - bank
    - 银行
    - 信用卡
    - 身份证
  action_whitelist:
    - none
    - click
    - double_click
    - right_click
    - move
    - drag
    - scroll
    - type
    - key
    - hotkey
    - wait
    - reidentify
  app_allowlist: []           # empty = all apps not in denylist
  app_denylist:
    - Taskmgr
    - regedit
    - cmd.exe
    - powershell
  window_title_allowlist: []
  window_title_denylist:
    - 密码
    - Password
    - Credential
    - 银行
    - Bank
    - UAC
  domain_allowlist: []
  domain_denylist: []
  max_actions_per_minute: 30
  max_consecutive_actions: 12
  max_task_duration_sec: 300
  max_mouse_move_px: 5000
  emergency_stop_enabled: true
  pause_on_focus_loss: false
  audit_enabled: true
  audit_dir: logs/audit
  persist_frames: false
  persist_ocr: false
  persist_model_context: false
  redact_pii: true
  block_prompt_injection: true
  ignore_screen_instructions: true

frontend:
  mode: cli                 # cli | gui
  show_trace: true
  window_title: "baodou — AI 桌面助手"
  refresh_ms: 500
  preview_max_width: 720
  preview_max_height: 480
  show_diagnostics: true
  metrics_interval_ms: 1000
  activity_indicators: true
  recent_errors_max: 12
  auto_refresh_preview: false
  default_mock: true        # GUI 默认 mock 后端，避免误操作
