[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baodou"
version = "0.1.0"
description = "Local AI desktop operation assistant (Windows 11)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "baodou" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "psutil>=5.9",
  "mss>=9.0",
  "Pillow>=10.0",
  "requests>=2.31",
  "numpy>=1.26",
  "comtypes>=1.4; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-requests",
  "types-psutil",
]
ocr = [
  "pytesseract>=0.3.10",
]

[project.scripts]
baodou = "frontend.cli:main"
baodou-demo = "frontend.cli:demo_main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "core*",
  "capture*",
  "ui_vision*",
  "inference*",
  "agent*",
  "actuator*",
  "safety*",
  "frontend*",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "core",
  "capture",
  "ui_vision",
  "inference",
  "agent",
  "actuator",
  "safety",
  "frontend",
  "tests",
  "benchmarks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP046"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
packages = [
  "core",
  "capture",
  "ui_vision",
  "inference",
  "agent",
  "actuator",
  "safety",
  "frontend",
]

[tool.coverage.run]
source = [
  "core",
  "capture",
  "ui_vision",
  "inference",
  "agent",
  "actuator",
  "safety",
  "frontend",
]
omit = ["tests/*", "benchmarks/*"]
